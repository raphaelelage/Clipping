name: clipping

on:
  workflow_dispatch:
    inputs:
      vertical:
        description: "Vertical"
        required: false
        default: "saude_educacao"
        type: choice
        options: ["saude_educacao", "saude", "educacao"]
      when:
        description: "Período de busca (ex: 1d, 2d, 7d, 12h, 1h)"
        required: false
        default: "1d"
      recipients:
        description: "E-mails destino (vírgula). Vazio = lista padrão do clipping.py"
        required: false
        default: ""
      repair_from:
        description: "Manutenção: nome da pasta do Drive de onde recuperar arquivos (deixe vazio)"
        required: false
        default: ""
      merge_from:
        description: "Manutenção: mesclar o backlog de outra pasta do Drive (deixe vazio)"
        required: false
        default: ""
      backlog_reset:
        description: "Manutenção: 1 = zerar o histórico (backlog) desta vertical (deixe vazio)"
        required: false
        default: ""

# Sem 'schedule:' de propósito — o agendamento é por gatilho externo
# (cron-job.org -> workflow_dispatch via API), que dispara na hora, sem a fila do cron do GitHub.

# COLETA DIVIDIDA — por que existe:
# O Google News respondia em 153s, e a MAIOR PARTE disso nao era rede: eram as pausas de
# 0,5s entre as 122 buscas, obrigatorias para nao tomar bloqueio. Threads dentro de um
# processo so ja foram testadas e falharam feio (coleta caiu de ~225 para 12 noticias),
# porque o Google limita por IP e a rajada saia toda do mesmo lugar.
# A saida: varios JOBS, que o Actions coloca em MAQUINAS diferentes com IPs diferentes
# (medido numa mesma execucao: 20.119.x, 20.168.x, 135.232.x, 172.182.x). Cada robo mantem
# o mesmo ritmo seguro de 0,5s, so que sobre um quarto das keywords.
# Resultado medido: 153s -> ~28s, com cobertura IDENTICA (3549 itens, as mesmas 13 vazias).
# Se um robo falhar, o job 'montar' ABORTA em vez de enviar clipping incompleto.
# Para voltar ao modo antigo: e so por GN_SHARDS: "0" no job montar (nada mais muda).
# ONDE RODA: no PC do Raphael quando ele estiver ligado; no GitHub quando nao estiver.
# O job 'escolher' pergunta a API se ha runner proprio online e o resto obedece.
# Sao dois modos, porque a maquina muda o que e vantajoso:
#   PC ligado  -> UM job so, coleta sequencial (GN_SHARDS=0). Um runner atende um job por vez,
#                 entao dividir em 4 nao paralelizaria nada — e todos sairiam do MESMO IP
#                 residencial, que e justamente a rajada que derruba o Google.
#   PC desligado -> 4 robos no GitHub, cada um numa maquina com IP proprio (o modo medido:
#                 153s -> ~28s com cobertura identica).
# Em qualquer duvida (API fora do ar, token sem permissao) cai no GitHub, que sempre funciona.

permissions:
  contents: read

jobs:
  escolher:
    runs-on: ubuntu-latest
    outputs:
      maquina: ${{ steps.decidir.outputs.maquina }}
      shards: ${{ steps.decidir.outputs.shards }}
    steps:
      - id: decidir
        env:
          GH_TOKEN: ${{ secrets.RUNNER_PAT || github.token }}
        run: |
          # runner "online e livre". Se a chamada falhar por qualquer motivo, ONLINE=0 e vamos
          # para o GitHub — nunca o contrario, para nao mandar o job para uma maquina desligada.
          ONLINE=$(gh api "repos/${{ github.repository }}/actions/runners" \
                     --jq '[.runners[] | select(.status=="online" and (.busy|not))] | length' \
                   2>/dev/null || echo 0)
          if [ "${ONLINE:-0}" -gt 0 ]; then
            echo "PC ligado ($ONLINE runner livre) -> rodando local, modo sequencial"
            echo "maquina=self-hosted" >> "$GITHUB_OUTPUT"
            echo "shards=0"            >> "$GITHUB_OUTPUT"
          else
            # Distingue "PC desligado" de "nao consegui nem perguntar": listar runners exige um
            # token com permissao de Administration:Read, que o GITHUB_TOKEN padrao NAO tem.
            # Sem o secret RUNNER_PAT, este job sempre escolhe o GitHub — que funciona, so nao
            # aproveita o PC. Veja SETUP_APP.md.
            if [ -z "${{ secrets.RUNNER_PAT }}" ]; then
              echo "AVISO: secret RUNNER_PAT ausente — nao da para consultar o PC, indo de GitHub"
            fi
            echo "PC indisponivel -> rodando no GitHub com 4 robos"
            echo "maquina=ubuntu-latest" >> "$GITHUB_OUTPUT"
            echo "shards=4"              >> "$GITHUB_OUTPUT"
          fi

  coletar:
    needs: escolher
    if: needs.escolher.outputs.shards != '0'    # no PC nao ha o que dividir
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # um robo cair nao deve matar os outros; a trava fica no 'montar'
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip                      # sem isso o pip install roda do zero nos 5 jobs
          cache-dependency-path: clipping_requirements.txt

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r clipping_requirements.txt
          pip install --no-deps pygooglenews==0.1.2

      - name: Coletar fatia ${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: "4"
          VERTICAL: ${{ github.event.inputs.vertical }}
          WHEN: ${{ github.event.inputs.when }}
        run: python coletar_shard.py

      - uses: actions/upload-artifact@v4
        with:
          name: gn-shard-${{ matrix.shard }}
          path: gn_shard_${{ matrix.shard }}.csv
          retention-days: 1

  montar:
    needs: [escolher, coletar]
    # always() para rodar mesmo se um robo falhou (a trava avisa) e tambem quando 'coletar' foi
    # pulado de proposito por estarmos no PC. So nao roda se a propria escolha falhar.
    if: always() && needs.escolher.result == 'success'
    runs-on: ${{ needs.escolher.outputs.maquina }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip                      # sem isso o pip install roda do zero nos 5 jobs
          cache-dependency-path: clipping_requirements.txt

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r clipping_requirements.txt
          pip install --no-deps pygooglenews==0.1.2

      - uses: actions/download-artifact@v4
        if: needs.escolher.outputs.shards != '0'
        with:
          pattern: gn-shard-*
          path: gn_shards

      - name: Run bot
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          SEC_CONTATO: ${{ vars.SEC_CONTATO }}          # opcional: sobrepoe o e-mail de contato enviado a SEC
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          VERTICAL: ${{ github.event.inputs.vertical }}
          DRIVE_REPAIR_FROM: ${{ github.event.inputs.repair_from }}
          BACKLOG_RESET: ${{ github.event.inputs.backlog_reset }}
          BACKLOG_MERGE_FROM: ${{ github.event.inputs.merge_from }}
          WHEN_OVERRIDE: ${{ github.event.inputs.when }}
          EMAIL_TO_OVERRIDE: ${{ github.event.inputs.recipients || vars.CLIP_RECIPIENTS }}
          GN_SHARDS: ${{ needs.escolher.outputs.shards }}
        run: python clipping.py
