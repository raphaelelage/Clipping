name: blast-ans

# Blast de Net Adds da ANS (Sala de Situacao).
# Roda no PC do Raphael quando ele estiver ligado; se nao, no GitHub — mesma
# logica do clipping diario. Aqui NAO ha coleta dividida: sao ~92 series, que o
# coletor resolve em poucos minutos de uma maquina so.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "completo = coleta a ANS e grava no BQ · tabela = so remonta do BQ"
        required: false
        default: "completo"
        type: choice
        options: ["completo", "tabela"]
      mes:
        description: "AAAA-MM (vazio = o ultimo disponivel)"
        required: false
        default: ""
      fase:
        description: "1 = so os grupos (e-mail rapido) - 2 = base completa + quebras - auto = decide pela maquina"
        required: false
        default: "auto"
        type: choice
        options: ["auto", "1", "2"]
      maquina:
        description: "onde rodar - auto deixa o job escolher"
        required: false
        default: "auto"
        type: choice
        options: ["auto", "self-hosted", "ubuntu-latest"]
      recipients:
        description: "E-mails destino (virgula). Vazio = BLAST_RECIPIENTS"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  escolher:
    runs-on: ubuntu-latest
    outputs:
      maquina: ${{ steps.decidir.outputs.maquina }}
    steps:
      - id: decidir
        env:
          GH_TOKEN: ${{ secrets.RUNNER_PAT || github.token }}
          PEDIDA: ${{ github.event.inputs.maquina }}
        run: |
          # Quem costuma decidir e o APP, que ve o runner com o PAT dele e manda
          # `maquina` pronta. Aqui so obedecemos.
          if [ -n "$PEDIDA" ] && [ "$PEDIDA" != "auto" ]; then
            echo "maquina pedida no disparo: $PEDIDA"
            echo "maquina=$PEDIDA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Sem pedido explicito, tentamos ver o runner. ATENCAO: o github.token
          # NAO consegue listar runners (nao existe permissao `administration`
          # para ele), entao sem o secret RUNNER_PAT esta consulta SEMPRE falha
          # e cai no ubuntu — por isso o app e quem decide (04/10/2026).
          if ONLINE=$(gh api "repos/${{ github.repository }}/actions/runners" \
                        --jq '[.runners[] | select(.status=="online" and (.busy|not))] | length' \
                      2>/tmp/err); then
            echo "runners livres: $ONLINE"
          else
            echo "nao consegui consultar os runners: $(head -c 200 /tmp/err)"
            ONLINE=0
          fi
          # Na duvida, GitHub — nunca o contrario, para nao mandar o job para
          # uma maquina desligada e ele ficar na fila.
          if [ "${ONLINE:-0}" -gt 0 ]; then
            echo "PC ligado -> self-hosted"
            echo "maquina=self-hosted" >> "$GITHUB_OUTPUT"
          else
            echo "PC indisponivel -> ubuntu-latest"
            echo "maquina=ubuntu-latest" >> "$GITHUB_OUTPUT"
          fi

  blast:
    needs: escolher
    runs-on: ${{ needs.escolher.outputs.maquina }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        # xlsxwriter: a planilha e escrita com ele desde 02/10/2026 (formato por
        # COLUNA, 25 min -> segundos). Faltava aqui, e o run morria depois de
        # coletar e gravar no BQ — tudo certo menos o arquivo (04/10/2026).
        run: pip install -r clipping_requirements.txt google-cloud-bigquery pandas-gbq xlsxwriter

      - name: Credencial do BigQuery
        env:
          SA: ${{ secrets.GCP_SA_KEY }}
        run: |
          # `secrets` nao existe no `if:` de um step — o teste tem que ser aqui dentro
          if [ -z "$SA" ]; then echo "sem GCP_SA_KEY — o run vai falhar no BQ"; exit 0; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/gcp.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp.json" >> "$GITHUB_ENV"

      - name: Rodar o Blast
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          BLAST_TO: ${{ github.event.inputs.recipients || vars.BLAST_RECIPIENTS }}
          BQ_PROJECT: ${{ vars.BQ_PROJECT || 'ans-net-adds-big-query' }}
          # o python precisa saber ONDE esta: no PC o tempo e de graca e vale
          # varrer tudo; no runner do GitHub e cota paga
          BLAST_MAQUINA: ${{ needs.escolher.outputs.maquina }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.modo }}" = "tabela" ]; then ARGS="--so-tabela"; fi
          if [ -n "${{ github.event.inputs.mes }}" ]; then ARGS="$ARGS --mes ${{ github.event.inputs.mes }}"; fi
          # `fase` existe para o PC pedir o segundo e-mail (base completa) depois
          # de terminar a varredura: aqui ninguem coleta, so remonta do BQ.
          FASE="${{ github.event.inputs.fase }}"
          if [ -n "$FASE" ] && [ "$FASE" != "auto" ]; then ARGS="$ARGS --fase $FASE"; fi
          python blast_run.py $ARGS

      - name: Subir a planilha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blast-ans
          path: |
            ANS_Net_Adds_Blast*.xlsx
            ANS_Net_Adds_Blast*.zip
            ANS_Net_Adds_Blast*.html
            ANS_Net_Adds_Blast*.txt
          if-no-files-found: warn
